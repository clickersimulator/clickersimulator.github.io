<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Catalog Index</title>
    <style>
        :root {
            --bg-color: #0c0d10;
            --card-bg: #14161b;
            --border-color: #1f232b;
            --accent-color: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 50px 20px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .counter-badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-color);
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 24px 16px;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 12px 30px -10px rgba(59, 130, 246, 0.2);
        }

        .icon-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 18px auto;
            background: #1a1d24;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            transition: transform 0.3s ease;
        }

        .card:hover .icon-container {
            transform: scale(1.08);
        }

        .icon-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .pet-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pet-id {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            color: var(--text-muted);
            font-size: 0.9rem;
            opacity: 0;
            animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
        }

        @keyframes fadeInDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

            const img = card.querySelector('img');

                fetch(`https://thumbnails.roblox.com/v1/assets?assetIds=${pet.iconId}&returnPolicy=2&size=150x150&format=Png&isCircular=false`)
                    .then(response => response.json())
                    .then(data => {
                        if (data && data.data && data.data[0] && data.data[0].imageUrl) {
                            img.src = data.data[0].imageUrl;
                        } else {
                            img.src = `https://www.roblox.com/asset-thumbnail/image?assetId=${pet.iconId}&width=150&height=150&format=png`;
                        }
                    })
                    .catch(() => {
                        img.src = `https://www.roblox.com/asset-thumbnail/image?assetId=${pet.iconId}&width=150&height=150&format=png`;
                    });
            } else {
                img.src = "";
            }
